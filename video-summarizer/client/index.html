<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영상 음성 추출 및 요약</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.263.1/font/lucide.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .glass {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen gradient-bg">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // API 베이스 URL
    const API_BASE = 'http://localhost:3001/api';

    // 지원 언어 목록
    const LANGUAGES = [
      { code: 'auto', name: '자동 감지' },
      { code: 'ko', name: '한국어' },
      { code: 'en', name: 'English' },
      { code: 'ja', name: '日本語' },
      { code: 'zh', name: '中文' },
    ];

    const SUMMARY_LANGUAGES = [
      { code: 'ko', name: '한국어' },
      { code: 'en', name: 'English' },
      { code: 'ja', name: '日本語' },
      { code: 'zh', name: '中文' },
    ];

    function App() {
      const [url, setUrl] = useState('');
      const [language, setLanguage] = useState('auto');
      const [summaryLanguage, setSummaryLanguage] = useState('ko');
      const [loading, setLoading] = useState(false);
      const [progress, setProgress] = useState(null);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState('summary');
      const pollingRef = useRef(null);

      // 작업 상태 폴링
      const pollStatus = async (jobId) => {
        try {
          const response = await fetch(`${API_BASE}/status/${jobId}`);
          const data = await response.json();

          if (data.status === 'completed') {
            setResult(data.result);
            setLoading(false);
            setProgress(null);
            clearInterval(pollingRef.current);
          } else if (data.status === 'failed') {
            setError(data.error || '처리 중 오류가 발생했습니다.');
            setLoading(false);
            setProgress(null);
            clearInterval(pollingRef.current);
          } else {
            setProgress({
              percent: data.progress,
              step: data.step
            });
          }
        } catch (err) {
          console.error('상태 확인 오류:', err);
        }
      };

      // 영상 처리 요청
      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!url.trim()) {
          setError('영상 URL을 입력해주세요.');
          return;
        }

        setLoading(true);
        setError(null);
        setResult(null);
        setProgress({ percent: 0, step: '요청 전송 중...' });

        try {
          const response = await fetch(`${API_BASE}/transcribe`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              url: url.trim(),
              language,
              summaryLanguage
            })
          });

          const data = await response.json();

          if (!data.success) {
            throw new Error(data.error || '요청 실패');
          }

          // 폴링 시작
          pollingRef.current = setInterval(() => {
            pollStatus(data.jobId);
          }, 2000);

        } catch (err) {
          setError(err.message);
          setLoading(false);
          setProgress(null);
        }
      };

      // 컴포넌트 언마운트 시 폴링 정리
      useEffect(() => {
        return () => {
          if (pollingRef.current) {
            clearInterval(pollingRef.current);
          }
        };
      }, []);

      // 시간 포맷팅
      const formatDuration = (seconds) => {
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);

        if (hrs > 0) {
          return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-4xl mx-auto">
            {/* 헤더 */}
            <header className="text-center mb-8">
              <h1 className="text-3xl md:text-4xl font-bold text-white mb-2">
                영상 음성 추출 & 요약
              </h1>
              <p className="text-white/80">
                YouTube, Vimeo 등 영상 링크를 입력하면 음성을 텍스트로 변환하고 요약해드립니다
              </p>
            </header>

            {/* 입력 폼 */}
            <div className="glass rounded-2xl shadow-xl p-6 mb-6">
              <form onSubmit={handleSubmit}>
                <div className="mb-4">
                  <label className="block text-gray-700 font-medium mb-2">
                    영상 URL
                  </label>
                  <input
                    type="url"
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    placeholder="https://www.youtube.com/watch?v=..."
                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                    disabled={loading}
                  />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                  <div>
                    <label className="block text-gray-700 font-medium mb-2">
                      영상 언어
                    </label>
                    <select
                      value={language}
                      onChange={(e) => setLanguage(e.target.value)}
                      className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                      disabled={loading}
                    >
                      {LANGUAGES.map((lang) => (
                        <option key={lang.code} value={lang.code}>
                          {lang.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-gray-700 font-medium mb-2">
                      요약 언어
                    </label>
                    <select
                      value={summaryLanguage}
                      onChange={(e) => setSummaryLanguage(e.target.value)}
                      className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                      disabled={loading}
                    >
                      {SUMMARY_LANGUAGES.map((lang) => (
                        <option key={lang.code} value={lang.code}>
                          {lang.name}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3 px-6 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold rounded-lg hover:from-purple-700 hover:to-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {loading ? '처리 중...' : '분석 시작'}
                </button>
              </form>
            </div>

            {/* 에러 메시지 */}
            {error && (
              <div className="glass rounded-2xl shadow-xl p-4 mb-6 border-l-4 border-red-500">
                <p className="text-red-600 font-medium">{error}</p>
              </div>
            )}

            {/* 진행 상황 */}
            {progress && (
              <div className="glass rounded-2xl shadow-xl p-6 mb-6">
                <h3 className="font-semibold text-gray-700 mb-4">처리 진행 중...</h3>
                <div className="mb-2">
                  <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                    <div
                      className="h-full bg-gradient-to-r from-purple-600 to-indigo-600 transition-all duration-500"
                      style={{ width: `${progress.percent}%` }}
                    />
                  </div>
                </div>
                <p className="text-gray-600 text-sm animate-pulse-slow">
                  {progress.step} ({progress.percent}%)
                </p>
              </div>
            )}

            {/* 결과 */}
            {result && (
              <div className="glass rounded-2xl shadow-xl overflow-hidden">
                {/* 영상 정보 */}
                <div className="p-6 border-b border-gray-200 bg-gradient-to-r from-purple-50 to-indigo-50">
                  <div className="flex items-start gap-4">
                    {result.videoInfo.thumbnail && (
                      <img
                        src={result.videoInfo.thumbnail}
                        alt="썸네일"
                        className="w-32 h-20 object-cover rounded-lg shadow"
                      />
                    )}
                    <div>
                      <h3 className="font-bold text-lg text-gray-800">
                        {result.videoInfo.title}
                      </h3>
                      <p className="text-gray-600 text-sm">
                        길이: {formatDuration(result.videoInfo.duration)} |
                        감지된 언어: {result.transcription.language}
                      </p>
                    </div>
                  </div>
                </div>

                {/* 탭 네비게이션 */}
                <div className="flex border-b border-gray-200">
                  <button
                    onClick={() => setActiveTab('summary')}
                    className={`flex-1 py-3 px-4 font-medium transition ${
                      activeTab === 'summary'
                        ? 'text-purple-600 border-b-2 border-purple-600'
                        : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    요약
                  </button>
                  <button
                    onClick={() => setActiveTab('transcript')}
                    className={`flex-1 py-3 px-4 font-medium transition ${
                      activeTab === 'transcript'
                        ? 'text-purple-600 border-b-2 border-purple-600'
                        : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    전체 스크립트
                  </button>
                  <button
                    onClick={() => setActiveTab('segments')}
                    className={`flex-1 py-3 px-4 font-medium transition ${
                      activeTab === 'segments'
                        ? 'text-purple-600 border-b-2 border-purple-600'
                        : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    타임스탬프
                  </button>
                </div>

                {/* 탭 콘텐츠 */}
                <div className="p-6">
                  {activeTab === 'summary' && (
                    <div>
                      <div className="prose max-w-none">
                        <div className="whitespace-pre-wrap text-gray-700 leading-relaxed">
                          {result.summary.text}
                        </div>
                      </div>
                      {result.summary.keyPoints.length > 0 && (
                        <div className="mt-6 pt-6 border-t border-gray-200">
                          <h4 className="font-semibold text-gray-800 mb-3">핵심 포인트</h4>
                          <ul className="space-y-2">
                            {result.summary.keyPoints.map((point, idx) => (
                              <li key={idx} className="flex items-start gap-2">
                                <span className="text-purple-600 mt-1">•</span>
                                <span className="text-gray-700">{point}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'transcript' && (
                    <div className="prose max-w-none">
                      <div className="whitespace-pre-wrap text-gray-700 leading-relaxed">
                        {result.transcription.text}
                      </div>
                    </div>
                  )}

                  {activeTab === 'segments' && (
                    <div className="space-y-2 max-h-96 overflow-y-auto">
                      {result.transcription.segments.map((segment, idx) => (
                        <div
                          key={idx}
                          className="flex gap-4 p-3 rounded-lg hover:bg-gray-50 transition"
                        >
                          <span className="text-purple-600 font-mono text-sm whitespace-nowrap">
                            {formatDuration(segment.start)}
                          </span>
                          <span className="text-gray-700">{segment.text}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* 복사 버튼 */}
                <div className="p-4 border-t border-gray-200 bg-gray-50 flex gap-2">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(result.summary.text);
                      alert('요약이 클립보드에 복사되었습니다.');
                    }}
                    className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition text-sm"
                  >
                    요약 복사
                  </button>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(result.transcription.text);
                      alert('스크립트가 클립보드에 복사되었습니다.');
                    }}
                    className="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition text-sm"
                  >
                    스크립트 복사
                  </button>
                </div>
              </div>
            )}

            {/* 푸터 */}
            <footer className="text-center mt-8 text-white/60 text-sm">
              <p>Powered by OpenAI Whisper & GPT</p>
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
